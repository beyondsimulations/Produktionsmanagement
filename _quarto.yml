project:
  type: website
  render:
    - index.qmd
    - 404.qmd
    - general/*.qmd
    - lectures/*.qmd
    - tutorials/*.qmd
lang: de
website:
  favicon: images/favicon.svg
  title: "Produktionsmanagement"
  repo-url: https://github.com/beyondsimulations/Produktionsmanagement
  site-url: https://beyondsimulations.github.io/Produktionsmanagement
  bread-crumbs: true
  sidebar:
    style: floating
    logo:
      light: images/course-logo.svg
      dark: images/course-logo-dark.svg
    logo-alt: "Produktionsmanagement"
    collapse-level: 2
    search: true
    contents:
      - text: "Willkommen"
        href: index.qmd
      - text: "***"
      - section: "01 Standorte"
        contents:
          - text: "Vorlesung"
            href: lectures/lec-01-standort.pdf
          - text: "Tutorium"
            href: tutorials/tutorial-01.qmd
      - section: "02 Leistung"
        contents:
          - text: "Vorlesung"
            href: lectures/lec-02-fliessband.pdf
          - text: "Tutorium"
            href: tutorials/tutorial-02.qmd
      - section: "03 Qualität"
        contents:
          - text: "Vorlesung"
            href: lectures/lec-03-qualitaet.pdf
          - text: "Tutorium"
            href: tutorials/tutorial-03.qmd
      - section: "04 Produktion"
        contents:
          - text: "Vorlesung"
            href: lectures/lec-04-produktion.pdf
          - text: "Tutorium"
            href: tutorials/tutorial-04.qmd
      - section: "05 Ressourcen"
        contents:
          - text: "Vorlesung"
            href: lectures/lec-05-ressourcen.pdf
          - text: "Tutorium"
            href: tutorials/tutorial-05.qmd
      - text: "***"
      - text: "FAQs"
        href: general/faq.qmd

  page-footer:
    center: "Produktionsmanagement, Dr. Tobias Vlćek </br>CC BY-SA 4.0"
    left:
      - icon: github
        href: https://github.com/beyondsimulations/Produktionsmanagement
        aria-label: GitHub-Repository
      - icon: linkedin
        href: https://linkedin.com/in/tobiasvlcek
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:vlcek@beyondsimulations.com
        aria-label: E-Mail
      - icon: skip-backward
        href: https://tobiasvlcek.com/lectures/
        aria-label: Alle Lehrveranstaltungen
      - icon: shield-check
        href: general/privacy.qmd
        aria-label: Datenschutz
      - icon: info-circle
        href: general/imprint.qmd
        aria-label: Impressum

format:
  html:
    theme:
      light:
        - default
        - styles.scss
        - brand
      dark:
        - default
        - _dark.scss
        - styles.scss
        - brand
    respect-user-color-scheme: true
    toc: true
    syntax-highlighting:
      light: _paper-and-ink-light.theme
      dark: _paper-and-ink-dark.theme
    callout-appearance: simple
    code-copy: true
    code-link: true
    toc-location: right
    code-overflow: wrap
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    include-in-header:
      - general/header.html
      - general/favicon.html
    include-after-body:
      text: |
        <script defer src="https://oshu.eu/widget.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                ChatWidget.init({
                    tenant: "platform",
                    agent: "produktionsmanagement",
                    layoutMode: "sidebar",
                });
            });
        </script>


  typst:
    syntax-highlighting: _paper-and-ink-light.theme
    template-partials:
      - helpers/typst-show.typ
    logo:
      path: images/course-logo.svg
      alt: "Produktionsmanagement"
    papersize: a4

format-links:
  - html
  - format: typst
    text: PDF
    icon: file-pdf

execute:
  freeze: auto

brand: _brand.yml

filters:
  - helpers/typst-classes.lua
  - helpers/page-pauses.lua
